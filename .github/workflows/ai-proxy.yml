name: AI Proxy desktop builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/proxy/**'
      - 'scripts/amiga/*relay*'
      - 'scripts/amiga/*git_service*'
      - 'scripts/amiga/test_bridge_mailbox.py'
      - '.github/workflows/ai-proxy.yml'
      - 'scripts/amiga/release_docs.py'
      - 'README.md'
      - 'LICENSE'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r scripts/proxy/requirements.txt
      - run: python scripts/proxy/check.py
      - run: python scripts/proxy/build.py
      - if: runner.os == 'macOS'
        run: python scripts/proxy/smoke_bundle.py 'dist/proxy/Termic AI Proxy.app/Contents/MacOS/Termic AI Proxy'
      - if: runner.os == 'macOS'
        run: python scripts/proxy/accept_mailbox.py 'dist/proxy/Termic AI Proxy.app/Contents/MacOS/Termic AI Proxy'
      - if: runner.os == 'macOS'
        run: python scripts/proxy/accept_desktop.py 'dist/proxy/Termic AI Proxy.app/Contents/MacOS/Termic AI Proxy'
      - if: runner.os == 'Windows'
        run: python scripts/proxy/smoke_bundle.py 'dist/proxy/Termic AI Proxy/Termic AI Proxy.exe'
      - if: runner.os == 'Windows'
        run: python scripts/proxy/accept_mailbox.py 'dist/proxy/Termic AI Proxy/Termic AI Proxy.exe'
      - if: runner.os == 'Windows'
        run: python scripts/proxy/accept_desktop.py 'dist/proxy/Termic AI Proxy/Termic AI Proxy.exe'
      - if: runner.os == 'macOS'
        run: |
          python scripts/proxy/package.py --bundle 'dist/proxy/Termic AI Proxy.app' --output 'dist/release/Termic-AI-Proxy'
          ditto -c -k --keepParent 'dist/release/Termic-AI-Proxy' 'dist/proxy/Termic-AI-Proxy-macOS.zip'
      - if: runner.os == 'Windows'
        run: |
          python scripts/proxy/package.py --bundle 'dist/proxy/Termic AI Proxy' --output 'dist/release/Termic AI Proxy'
          Compress-Archive -Path 'dist/release/Termic AI Proxy' -DestinationPath 'dist/proxy/Termic-AI-Proxy-Windows.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Termic-AI-Proxy-${{ runner.os }}
          path: |
            dist/proxy/Termic-AI-Proxy-macOS.zip
            dist/proxy/Termic-AI-Proxy-Windows.zip
          retention-days: 30
